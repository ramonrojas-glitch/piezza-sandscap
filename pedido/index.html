<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sigue tu pedido | PIEZZA Pizzería</title><meta name="description" content="Mira en qué va tu pedido de PIEZZA.">
<meta name="robots" content="noindex"><meta name="theme-color" content="#B3172E">
<link rel="icon" type="image/png" href="/images/favicon.png"><link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,700..900,100&family=Poppins:wght@400;500;600;700&display=swap">
<script src="/track.js"></script>
<script src="/pedido/estado.js"></script>
<style>
*{box-sizing:border-box}
:root{--red:#B3172E;--ink:#241A17;--mut:#6E625D;--line:#EFE5E1;--cream:#FFF7F2;--green:#1E9E5A}
body{margin:0;background:var(--cream);font-family:Poppins,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.top{background:#fff;border-bottom:1px solid var(--line)}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.bar{display:flex;align-items:center;justify-content:space-between;padding:12px 0}.bar img{height:42px;width:auto;display:block}
.bar a.b{height:40px;padding:0 14px;border-radius:999px;border:1.5px solid #EADFDB;display:inline-flex;align-items:center;color:var(--ink);text-decoration:none;font-size:14px;font-weight:500}
h1{font-family:Fraunces,Georgia,serif;font-weight:850;font-size:30px;line-height:1.1;margin:22px 0 4px}
.sub{color:var(--mut);margin:0 0 16px;font-size:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;margin:0 0 14px;box-shadow:0 12px 30px -24px rgba(90,10,18,.35)}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.ordno{display:inline-block;background:#FBE9E8;color:var(--red);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600}
.big{font-family:Fraunces,Georgia,serif;font-weight:850;font-size:26px;line-height:1.15;margin:10px 0 2px}
.eta{color:var(--mut);font-size:14px;margin:0}
.eta b{color:var(--ink)}
.prog{height:8px;border-radius:99px;background:#F4E9E5;margin:16px 0 4px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#D8263F,var(--red));border-radius:99px;transition:width .8s ease}
.steps{list-style:none;margin:14px 0 0;padding:0;position:relative}
.steps li{position:relative;display:flex;gap:12px;padding:0 0 16px 0}
.steps li:last-child{padding-bottom:0}
.steps li::before{content:"";position:absolute;left:13px;top:28px;bottom:2px;width:2px;background:#F0E3DE}
.steps li:last-child::before{display:none}
.steps li.ok::before{background:var(--red)}
.dot{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;background:#fff;border:2px solid #E7D9D4;color:#fff;position:relative;z-index:1}
.steps li.ok .dot{background:var(--red);border-color:var(--red)}
.steps li.now .dot{background:#fff;border-color:var(--red)}
.steps li.now .dot::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--red);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.6);opacity:.55}}
.st b{display:block;font-size:15px}.st span{display:block;color:var(--mut);font-size:13px;line-height:1.45}
.st time{font-size:12px;color:var(--mut);font-weight:500}
.steps li.next .st b{color:#A99B96;font-weight:500}
.map{position:relative;border-radius:16px;overflow:hidden;background:#F3EEE9;margin:14px 0 0;aspect-ratio:16/10}
.map svg{display:block;width:100%;height:100%}
.rider{display:flex;align-items:center;gap:12px;margin-top:14px}
.av{width:46px;height:46px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.rider .tx{flex:1;min-width:0}.rider .tx b{display:block}.rider .tx span{color:var(--mut);font-size:13px}
.ib{width:44px;height:44px;border-radius:50%;border:1.5px solid #EADFDB;background:#fff;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.ib.wa{background:#25D366;border-color:#25D366;color:#fff}
.rec .l{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:4px 0}
.rec .tot{border-top:1px solid var(--line);margin-top:6px;padding-top:10px;font-weight:700;font-size:16px}
.rec .meta{color:var(--mut);font-size:13px;margin-top:8px;line-height:1.5}
h2{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin:0 0 8px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border:0;border-radius:14px;background:var(--red);color:#fff;font:600 16px Poppins,system-ui,sans-serif;text-decoration:none;cursor:pointer}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid #EADFDB}
.list a{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none}
.list a:last-child{border-bottom:0}.list b{display:block}.list span{color:var(--mut);font-size:13px}
.pill{font-size:12px;font-weight:600;border-radius:999px;padding:4px 10px;background:#FBE9E8;color:var(--red);white-space:nowrap}
.pill.done{background:#E8F6EE;color:var(--green)}
label{display:block;font-size:14px;font-weight:500;margin:10px 0 6px}
input{width:100%;height:50px;border:1.5px solid #E7DCD8;border-radius:12px;padding:0 14px;font:16px Poppins,system-ui,sans-serif;color:var(--ink);background:#fff}
input:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px rgba(179,23,46,.12)}
.err{color:var(--red);font-size:14px;margin:10px 0 0}
.empty{text-align:center;color:var(--mut);padding:8px 0}
.help{display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 30px}
.help a{flex:1;min-width:150px}
footer{padding:10px 0 40px;color:var(--mut);font-size:13px;text-align:center}footer a{color:var(--mut)}
/* Notificación tipo WhatsApp */
.wa-note{position:fixed;left:50%;top:10px;z-index:50;width:min(380px,calc(100vw - 24px));transform:translate(-50%,-150%);background:rgba(250,250,250,.97);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:18px;box-shadow:0 18px 40px -14px rgba(0,0,0,.4);padding:12px 14px;display:flex;gap:12px;align-items:flex-start;transition:transform .45s cubic-bezier(.2,.85,.25,1);font-family:-apple-system,system-ui,Poppins,sans-serif;color:#111}
.wa-note{visibility:hidden}.wa-note.show{transform:translate(-50%,0);visibility:visible}
.wa-note .ic{width:38px;height:38px;border-radius:10px;background:#25D366;display:grid;place-items:center;flex:none}
.wa-note b{display:block;font-size:14px}.wa-note p{margin:2px 0 0;font-size:14px;line-height:1.35}.wa-note small{color:#888;font-size:12px;margin-left:auto}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,180%);background:var(--ink);color:#fff;border-radius:999px;padding:12px 18px;font-size:14px;transition:transform .35s;max-width:calc(100vw - 32px);text-align:center;z-index:60}
.toast{opacity:0;visibility:hidden}.toast.show{transform:translate(-50%,0);opacity:1;visibility:visible}
@media (prefers-reduced-motion:reduce){.steps li.now .dot::after{animation:none}.prog i,.wa-note,.toast{transition:none}}
.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.95);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
</style></head><body>
<header class="top"><div class="wrap bar"><a href="/"><img src="/images/piezza-horizontal.png" alt="PIEZZA Pizzería, inicio"></a><a class="b" href="/">Pedir de nuevo</a></div></header>
<main class="wrap" id="app"></main>
<footer class="wrap"><a href="/terminos/">Términos y entregas</a> · <a href="/privacidad/">Privacidad</a> · © 2026 PIEZZA Pizzería</footer>
<div class="wa-note" id="wa" role="status" aria-live="polite"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.9s.7-2.1 1-2.4c.3-.3.6-.3.8-.3h.6c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .6l-.4.6-.4.4c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1c.2-.3.4-.2.7-.1l2 1c.3.1.5.2.5.3.1.2.1.7-.1 1.3Z"/></svg></span><div style="flex:1;min-width:0"><div style="display:flex;gap:8px"><b>PIEZZA</b><small>ahora</small></div><p id="waText"></p></div></div>
<div class="toast" id="toast" role="status"></div>
<script>
(function () {
  const app = document.getElementById('app');
  const O = window.PZOrders;
  const fmt = (n) => 'RD$ ' + Math.round(n).toLocaleString('es-DO');
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const hhmm = (t) => new Date(t).toLocaleTimeString('es-DO', { hour: 'numeric', minute: '2-digit' });
  const digits = (s) => String(s || '').replace(/\D/g, '');
  const fmtPhone = (s) => { let d = digits(s); if (d.length === 11 && d[0] === '1') d = d.slice(1); return d.length === 10 ? d.slice(0, 3) + '-' + d.slice(3, 6) + '-' + d.slice(6) : d; };
  const brand = (b) => ({ visa: 'Visa', mastercard: 'Mastercard', amex: 'Amex' }[b] || 'Tarjeta');
  const track = (n, d) => { if (window.pzTrack) window.pzTrack(n, d || {}); };
  let toastT; const toast = (m) => { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); };
  let waT; const wa = (m) => { document.getElementById('waText').textContent = m; const n = document.getElementById('wa'); n.classList.add('show'); clearTimeout(waT); waT = setTimeout(() => n.classList.remove('show'), 4200); };
  const check = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

  // ---------- Mapa (ilustrado, sin servicios externos) ----------
  const PATH = 'M70 250 L70 170 L190 170 L190 95 L330 95 L330 150 L455 150 L455 70 L560 70';
  function mapSVG(o) {
    const pick = o.mode === 'pickup';
    return `<svg viewBox="0 0 640 400" role="img" aria-label="${pick ? 'Ubicación de la tienda' : 'Ruta de tu pedido'}">
      <rect width="640" height="400" fill="#F3EEE9"/>
      <g fill="#E8E0D9"><rect x="0" y="0" width="50" height="150"/><rect x="90" y="0" width="80" height="150"/><rect x="210" y="0" width="100" height="75"/><rect x="350" y="0" width="85" height="130"/><rect x="475" y="0" width="165" height="50"/><rect x="475" y="90" width="165" height="120"/><rect x="0" y="190" width="50" height="210"/><rect x="90" y="190" width="220" height="80"/><rect x="350" y="170" width="85" height="100"/><rect x="90" y="300" width="400" height="100"/><rect x="520" y="230" width="120" height="170"/></g>
      <rect x="210" y="115" width="100" height="35" rx="6" fill="#D9EDD3"/><rect x="350" y="300" width="70" height="60" rx="6" fill="#D9EDD3"/>
      <g stroke="#fff" stroke-width="20" fill="none" stroke-linecap="square"><path d="M70 0V400M190 0V290M330 0V290M455 0V290M0 170H640M0 95H640M0 290H640M500 70H640"/></g>
      <text x="200" y="285" font-size="13" fill="#A69A94" font-family="Poppins,sans-serif">Av. Abraham Lincoln</text>
      <text x="470" y="166" font-size="13" fill="#A69A94" font-family="Poppins,sans-serif">C/ Gustavo Mejía Ricart</text>
      ${pick ? '' : `<path d="${PATH}" fill="none" stroke="#B3172E" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 12" opacity=".55"/>`}
      <g transform="translate(70 250)"><circle r="20" fill="#B3172E"/><path d="M-8 -6l16 0 -8 14z" fill="#fff"/></g>
      ${pick ? '' : `<g transform="translate(560 70)"><circle r="20" fill="#241A17"/><path d="M-8 2l8-8 8 8v8h-16z" fill="#fff"/></g>`}
      ${pick ? '' : `<g id="riderDot"><circle r="16" fill="#fff" stroke="#B3172E" stroke-width="4"/><circle r="6" fill="#B3172E"/></g>`}
    </svg>`;
  }
  function placeRider(o, s) {
    const g = document.getElementById('riderDot'); if (!g) return;
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path'); path.setAttribute('d', PATH);
    const L = path.getTotalLength();
    const k = s.stage.k === 'camino' ? s.part : (s.done ? 1 : 0);
    const pt = path.getPointAtLength(L * k);
    g.setAttribute('transform', `translate(${pt.x} ${pt.y})`);
    g.style.display = (s.stage.k === 'camino' || s.done) ? '' : 'none';
  }

  // ---------- Un pedido ----------
  let timer = null, lastStage = null;
  function renderOrder(o) {
    track('seguimiento', { orden: o.no });
    document.title = `Pedido ${o.no} | PIEZZA`;
    const r = O.rider(o);
    const etaFrom = o.at + (o.mode === 'pickup' ? 20 : 35) * 60000, etaTo = o.at + (o.mode === 'pickup' ? 20 : 45) * 60000;
    app.innerHTML = `
      <h1>Tu pedido</h1>
      <p class="sub">Hecho a las ${hhmm(o.at)} · ${o.mode === 'pickup' ? 'Recoger en tienda' : 'Delivery'}</p>
      <section class="card" aria-live="polite">
        <div class="head"><span class="ordno">Orden ${esc(o.no)}</span><span class="pill" id="pill"></span></div>
        <p class="big" id="big"></p>
        <p class="eta" id="eta"></p>
        <div class="prog" aria-hidden="true"><i id="bar"></i></div>
        <ol class="steps" id="steps"></ol>
      </section>
      <section class="card" id="mapCard">
        <h2>${o.mode === 'pickup' ? 'Dónde recoger' : 'Tu rider'}</h2>
        <div class="map">${mapSVG(o)}</div>
        ${o.mode === 'pickup'
          ? `<div class="rider"><span class="av">P</span><div class="tx"><b>PIEZZA · Piantini</b><span>C/ Gustavo Mejía Ricart 54 · Lista en 20 min</span></div><a class="ib" href="https://maps.google.com/?q=Gustavo+Mejia+Ricart+54+Piantini+Santo+Domingo" target="_blank" rel="noopener" aria-label="Cómo llegar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l18-8-8 18-2-8z"/></svg></a></div>`
          : `<div class="rider" id="riderBox"><span class="av">${r.ini}</span><div class="tx"><b>${r.name}</b><span>${r.moto}</span></div>
              <button class="ib" type="button" data-act="llamar" aria-label="Llamar a ${r.name}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg></button>
              <button class="ib wa" type="button" data-act="whatsapp" aria-label="Escribir por WhatsApp a ${r.name}"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Z"/></svg></button></div>
             <p class="sub" id="riderWait" style="margin:12px 0 0">Te asignamos un rider en cuanto tu pizza salga del horno.</p>`}
      </section>
      <section class="card rec">
        <h2>Detalle</h2>
        ${o.items.map((c) => `<div class="l"><span>${c.qty} × ${esc(c.name)}${c.detail ? ` <span style="color:var(--mut);font-size:12px">· ${esc(c.detail)}</span>` : ''}</span><span>${fmt(c.qty * c.unit)}</span></div>`).join('')}
        <div class="l" style="color:var(--mut)"><span>${o.mode === 'pickup' ? 'Recoger en tienda' : 'Envío'}</span><span>${o.ship ? fmt(o.ship) : 'Gratis'}</span></div>
        <div class="l tot"><span>Total pagado</span><span>${fmt(o.total)}</span></div>
        <div class="meta">${o.via === 'brinco' ? 'Pagado con Brinco · ' : ''}${brand(o.card && o.card.brand)} •••• ${esc(o.card && o.card.last4)} · Autorización ${esc(o.auth)}${o.address ? `<br>Entrega: ${esc(o.address.street)}, ${esc(o.address.sector)}` : ''}<br>WhatsApp: ${fmtPhone(o.phone)}</div>
      </section>
      <div class="help">
        <a class="btn ghost" href="/pedido/">Mis pedidos</a>
        <button class="btn ghost" type="button" id="helpBtn">¿Algún problema?</button>
      </div>`;
    app.querySelectorAll('[data-act]').forEach((b) => b.addEventListener('click', () => {
      track('contacto_rider', { orden: o.no, via: b.dataset.act });
      toast(b.dataset.act === 'llamar' ? `Llamando a ${r.name.split(' ')[0]}…` : `Abriendo chat con ${r.name.split(' ')[0]}…`);
    }));
    document.getElementById('helpBtn').addEventListener('click', () => { track('ayuda_pedido', { orden: o.no }); toast('Te escribimos por WhatsApp en un momento'); });
    lastStage = null;
    tick(o);
    clearInterval(timer); timer = setInterval(() => tick(o), 1000);
  }
  function tick(o) {
    const s = O.status(o);
    const st = s.stages;
    document.getElementById('big').textContent = s.stage.label;
    const pill = document.getElementById('pill');
    pill.textContent = s.done ? (o.mode === 'pickup' ? 'Recogido' : 'Entregado') : 'En proceso';
    pill.className = 'pill' + (s.done ? ' done' : '');
    const eta = document.getElementById('eta');
    if (s.done) eta.innerHTML = s.stage.txt;
    else if (o.mode === 'pickup') eta.innerHTML = `${s.stage.txt}<br><b>Lista aprox. ${hhmm(o.at + 20 * 60000)}</b>`;
    else eta.innerHTML = `${s.stage.txt}<br><b>Llega entre ${hhmm(o.at + 35 * 60000)} y ${hhmm(o.at + 45 * 60000)}</b>`;
    document.getElementById('bar').style.width = Math.round(s.total * 100) + '%';
    document.getElementById('steps').innerHTML = st.map((x, j) => {
      const cls = j < s.i || (s.done && j === s.i) ? 'ok' : j === s.i ? 'now' : 'next';
      const t = o.at + x.t * 1000;
      return `<li class="${cls}"><span class="dot">${cls === 'ok' ? check : ''}</span><div class="st"><b>${x.label}</b>${cls !== 'next' ? `<time>${hhmm(t)}</time>` : ''}${cls === 'now' ? `<span>${x.txt}</span>` : ''}</div></li>`;
    }).join('');
    const box = document.getElementById('riderBox'), wait = document.getElementById('riderWait');
    if (box) { const on = s.stage.k === 'camino' || s.done; box.style.display = on ? '' : 'none'; wait.style.display = on ? 'none' : ''; }
    placeRider(o, s);
    if (lastStage !== null && lastStage !== s.stage.k) wa(s.stage.wa.replace('{no}', o.no));
    lastStage = s.stage.k;
    if (s.done) clearInterval(timer);
  }

  // ---------- Mis pedidos + buscar ----------
  function renderList(msg) {
    const list = O.orders().slice(0, 10);
    app.innerHTML = `
      <h1>Sigue tu pedido</h1>
      <p class="sub">Mira en qué va tu pizza, en vivo.</p>
      <section class="card">
        <h2>Mis pedidos</h2>
        ${list.length ? `<div class="list">${list.map((o) => { const s = O.status(o); return `<a href="/pedido/?o=${encodeURIComponent(o.no)}"><div><b>${esc(o.no)} · ${fmt(o.total)}</b><span>${new Date(o.at).toLocaleDateString('es-DO', { day: 'numeric', month: 'short' })}, ${hhmm(o.at)} · ${o.items.reduce((n, c) => n + c.qty, 0)} pizza${o.items.reduce((n, c) => n + c.qty, 0) > 1 ? 's' : ''}</span></div><span class="pill${s.done ? ' done' : ''}">${s.stage.label}</span></a>`; }).join('')}</div>`
          : `<p class="empty">Todavía no tienes pedidos en este celular.</p>`}
      </section>
      <section class="card">
        <h2>Buscar un pedido</h2>
        <form id="find" novalidate>
          <label for="fNo">Número de orden</label><input id="fNo" inputmode="numeric" placeholder="PZ-12345" autocomplete="off">
          <label for="fPh">Tu WhatsApp</label><input id="fPh" type="tel" inputmode="tel" placeholder="809-555-1234" autocomplete="tel">
          ${msg ? `<p class="err" role="alert">${esc(msg)}</p>` : ''}
          <button class="btn" type="submit" style="margin-top:14px">Ver mi pedido</button>
        </form>
      </section>
      <div class="help"><a class="btn ghost" href="/">Hacer un pedido</a></div>`;
    document.getElementById('find').addEventListener('submit', (e) => {
      e.preventDefault();
      const o = O.find(document.getElementById('fNo').value);
      const ph = digits(document.getElementById('fPh').value).slice(-7);
      if (!o || (ph && digits(o.phone).slice(-7) !== ph)) { renderList('No encontramos ese pedido. Revisa el número de orden que te llegó por WhatsApp.'); return; }
      location.href = '/pedido/?o=' + encodeURIComponent(o.no);
    });
  }

  const q = new URLSearchParams(location.search).get('o');
  const o = q ? O.find(q) : null;
  if (o) renderOrder(o); else renderList(q ? 'No encontramos ese pedido en este celular.' : '');
})();
</script>
</body></html>
